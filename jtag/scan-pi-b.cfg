# Premier controle JTAG seulement. Executer SUR le Raspberry Pi Model B.
# Preconditions : tension cible 3,3 V mesuree, cablage verifie, GPIO libres.
# Aucun acces NAND, aucun halt CPU, aucun reset systeme demande.
source [find interface/raspberrypi-native.cfg]
transport select jtag
# Brochage explicite : TCK=23, TMS=24, TDI=19, TDO=21 (physiques P1).
adapter gpio tck -chip 0 11
adapter gpio tms -chip 0 8
adapter gpio tdi -chip 0 10
adapter gpio tdo -chip 0 9
reset_config none
adapter speed 5

# Identifiant attendu par la configuration AT91SAM9 d'OpenOCD 0.12.0.
jtag newtap at91sam9g25 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x0792603f

gdb_port disabled
tcl_port disabled
telnet_port disabled
init
scan_chain
shutdown
