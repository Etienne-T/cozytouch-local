# Session de lecture NAND. GPIO fixes verifies le 17 novembre 2026.
source [find interface/raspberrypi-native.cfg]
transport select jtag
adapter gpio tck -chip 0 11
adapter gpio tms -chip 0 8
adapter gpio tdi -chip 0 10
adapter gpio tdo -chip 0 9
set AT91_CHIPNAME at91sam9g25
source [find target/at91sam9.cfg]
reset_config none
adapter speed 5
$_TARGETNAME configure -work-area-phys 0x00300000 -work-area-size 0x8000 -work-area-backup 1
nand device nandflash_cs3 at91sam9 $_TARGETNAME 0x40000000 0xffffe014
at91sam9 cle 0 22
at91sam9 ale 0 21
at91sam9 rdy_busy 0 0xfffff800 5
at91sam9 ce 0 0xfffffa00 4
bindto 127.0.0.1
gdb port disabled
telnet port disabled
tcl port 6666
init
